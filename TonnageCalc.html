<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asphalt Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Asphalt Tonnage Estimator</h1>
        
        <label for="length">Length (Feet)</label>
        <input type="number" id="length" required>

        <label for="width">Width (Feet)</label>
        <input type="number" id="width" required>

        <label for="depth">Depth (Inches)</label>
        <input type="number" id="depth" required>

        <button id="calcBtn">Calculate Tons Need</button>

        <div id="display">
            Results will appear here...
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
